<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Mogadishu Modern Furniture</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=21">

    <style>
        :root {
            --deep-green: #073D35;
            --gold: #D8A128;
            --light-bg: #FAF8F2;
            --soft-bg: #F4EFE6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Manrope', sans-serif;
            background:
                radial-gradient(circle at 15% 25%, rgba(216,161,40,0.11), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(7,61,53,0.07), transparent 35%),
                linear-gradient(135deg, #E6F2EF 0%, #F4EFE6 50%, #EDE8DF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 15px;
        }

        /* ======= CARD ======= */
        .register-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 38px 40px 32px;
            box-shadow:
                0 20px 50px rgba(7, 61, 53, 0.14),
                0 6px 16px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            overflow: hidden;
            animation: cardRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .register-card::before {
            display: none;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ======= BRAND ======= */
        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
            margin-bottom: 24px;
        }

        .brand-logo-mark {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-logo-frame {
            position: absolute;
            inset: 0;
            border: 2px solid var(--gold);
            border-radius: 11px;
            transform: rotate(45deg);
        }

        .brand-logo-inner {
            position: relative;
            z-index: 2;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: -1px;
        }

        .brand-divider {
            width: 1px;
            height: 44px;
            background: var(--gold);
            opacity: 0.85;
        }

        .brand-text { line-height: 1.05; }

        .brand-title {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--deep-green);
            letter-spacing: 0.2px;
        }

        .brand-subtitle {
            display: block;
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--deep-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
            opacity: 0.9;
        }

        /* ======= TITLES ======= */
        .page-title {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            color: var(--deep-green);
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-subtitle {
            text-align: center;
            color: #7A8585;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* ======= INPUT FIELDS ======= */
        .form-field {
            position: relative;
            margin-bottom: 16px;
        }

        .form-field .field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0ACAC;
            font-size: 0.9rem;
            z-index: 3;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-field:focus-within .field-icon {
            color: var(--deep-green);
        }

        .form-field input {
            width: 100%;
            padding: 13px 15px 13px 44px;
            border: 1.5px solid rgba(0, 0, 0, 0.10);
            border-radius: 11px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #111111;
            background: #FAFBFB;
            transition: all 0.3s ease;
            font-family: 'Manrope', sans-serif;
        }

        .form-field input:focus {
            outline: none;
            border-color: var(--deep-green);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(7, 61, 53, 0.08);
        }

        .form-field input::placeholder {
            color: #B0B8B8;
            font-weight: 500;
        }

        .form-field input.is-invalid {
            border-color: #B42318;
        }

        .form-field input.is-invalid:focus {
            box-shadow: 0 0 0 3.5px rgba(180, 35, 24, 0.08);
        }

        /* Password toggle */
        .pass-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #A0ACAC;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            z-index: 3;
        }

        .pass-toggle:hover {
            color: var(--gold);
            transform: translateY(-50%) scale(1.12);
        }



        /* ======= TERMS ======= */
        .terms-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 20px;
            font-size: 0.8rem;
            color: #5d6868;
            font-weight: 700;
            cursor: pointer;
        }

        .terms-row input {
            accent-color: var(--deep-green);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .terms-row a {
            color: var(--deep-green);
            text-decoration: none;
            font-weight: 900;
        }

        .terms-row a:hover {
            text-decoration: underline;
            color: var(--gold);
        }

        /* ======= BUTTON ======= */
        .register-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #073D35 0%, #0A5446 50%, #315C43 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 0.4px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(7, 61, 53, 0.28);
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* ======= LOGIN LINK ======= */
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #7A8585;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .login-link a {
            color: var(--deep-green);
            text-decoration: none;
            font-weight: 900;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: var(--gold);
        }

        /* ======= PHONE INPUT GROUP ======= */
        .phone-input-wrapper {
            display: flex;
            align-items: stretch;
            width: 100%;
        }

        .phone-input-wrapper .country-select {
            width: 110px;
            border: 1.5px solid rgba(0, 0, 0, 0.10);
            border-right: none;
            border-radius: 11px 0 0 11px;
            padding: 12px 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #111111;
            background: #FAFBFB;
            transition: all 0.3s ease;
            font-family: 'Manrope', sans-serif;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237A8585' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            padding-right: 24px;
        }

        .phone-input-wrapper .phone-input {
            flex: 1;
            border: 1.5px solid rgba(0, 0, 0, 0.10);
            border-radius: 0 11px 11px 0;
            padding: 12px 15px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #111111;
            background: #FAFBFB;
            transition: all 0.3s ease;
            font-family: 'Manrope', sans-serif;
            outline: none;
        }

        .phone-input-wrapper .country-select:focus,
        .phone-input-wrapper .phone-input:focus {
            border-color: var(--deep-green);
            background: #ffffff;
        }

        .phone-input-wrapper:focus-within .country-select {
            border-color: var(--deep-green);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(7, 61, 53, 0.08);
        }

        .phone-input-wrapper:focus-within .phone-input {
            border-color: var(--deep-green);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(7, 61, 53, 0.08);
        }
        
        .phone-input-wrapper .phone-input.is-invalid {
            border-color: #B42318;
        }

        /* ======= RESPONSIVE ======= */
        @media (max-width: 540px) {
            .register-card {
                padding: 30px 24px 26px;
                border-radius: 16px;
            }

            .page-title { font-size: 2.1rem; }
            .brand-title { font-size: 1.3rem; }
            .brand-subtitle { letter-spacing: 2.5px; }
        }

        @media (max-width: 380px) {
            .register-card {
                padding: 24px 18px 22px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">
    <!-- Brand Logo -->
    <div class="brand-logo">
        <div class="brand-logo-mark">
            <span class="brand-logo-frame"></span>
            <span class="brand-logo-inner">MF</span>
        </div>
        <div class="brand-divider"></div>
        <div class="brand-text">
            <span class="brand-title">Mogadishu</span>
            <span class="brand-subtitle">Modern Furniture</span>
        </div>
    </div>

    <h1 class="page-title">Create Account</h1>
    <p class="page-subtitle">Register your new account</p>

    <div id="alertContainer"></div>

    <form id="registerForm">
        <!-- First Name -->
        <div class="form-field">
            <i class="fa-regular fa-user field-icon"></i>
            <input
                type="text"
                id="regFirstName"
                class="auth-input"
                placeholder="First Name"
                required
            >
        </div>

        <!-- Last Name -->
        <div class="form-field">
            <i class="fa-regular fa-user field-icon"></i>
            <input
                type="text"
                id="regLastName"
                class="auth-input"
                placeholder="Last Name"
                required
            >
        </div>

        <!-- Gmail -->
        <div class="form-field">
            <i class="fa-regular fa-envelope field-icon"></i>
            <input
                type="email"
                id="regEmail"
                class="auth-input"
                placeholder="Gmail"
                required
            >
        </div>

        <!-- Phone Number -->
        <div class="form-field">
            <div class="phone-input-wrapper">
                <select id="regCountryCode" class="country-select">
                    <option value="+252" selected>🇸🇴 +252</option>
                    <option value="+254">🇰🇪 +254</option>
                    <option value="+251">🇪🇹 +251</option>
                    <option value="+253">🇩🇯 +253</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+90">🇹🇷 +90</option>
                </select>
                <input
                    type="tel"
                    id="regPhone"
                    class="auth-input phone-input"
                    placeholder="Phone Number"
                    required
                >
            </div>
        </div>

        <!-- Password -->
        <div class="form-field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
                type="password"
                id="regPassword"
                class="auth-input"
                placeholder="Password"
                required
            >
            <i class="fa-solid fa-eye-slash pass-toggle password-toggle-icon" onclick="togglePasswordVisibility('regPassword')"></i>

        </div>

        <!-- Confirm Password -->
        <div class="form-field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
                type="password"
                id="regConfirmPassword"
                class="auth-input"
                placeholder="Confirm Password"
                required
            >
            <i class="fa-solid fa-eye-slash pass-toggle password-toggle-icon" onclick="togglePasswordVisibility('regConfirmPassword')"></i>
        </div>

        <!-- Terms & Conditions -->
        <label class="terms-row">
            <input type="checkbox" id="termsCheck" required>
            <span>I agree to the <a href="#">Terms & Conditions</a></span>
        </label>

        <!-- Register Button -->
        <button type="submit" class="register-btn">
            Register
        </button>
    </form>

    <!-- Login Link -->
    <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=17"></script>



</body>
</html>
