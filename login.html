<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mogadishu Modern Furniture</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=21">

    <style>
        :root {
            --deep-green: #073D35;
            --gold: #D8A128;
            --light-bg: #FAF8F2;
            --soft-bg: #F4EFE6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Manrope', sans-serif;
            background:
                radial-gradient(circle at 15% 25%, rgba(216,161,40,0.11), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(7,61,53,0.07), transparent 35%),
                linear-gradient(135deg, #E6F2EF 0%, #F4EFE6 50%, #EDE8DF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 38px 40px 32px;
            box-shadow:
                0 20px 50px rgba(7, 61, 53, 0.14),
                0 6px 16px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            overflow: hidden;
            animation: cardRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
            margin-bottom: 24px;
        }

        .brand-logo-mark {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-logo-frame {
            position: absolute;
            inset: 0;
            border: 2px solid var(--gold);
            border-radius: 11px;
            transform: rotate(45deg);
        }

        .brand-logo-inner {
            position: relative;
            z-index: 2;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: -1px;
        }

        .brand-divider {
            width: 1px;
            height: 44px;
            background: var(--gold);
            opacity: 0.85;
        }

        .brand-text {
            line-height: 1.05;
        }

        .brand-title {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--deep-green);
            letter-spacing: 0.2px;
        }

        .brand-subtitle {
            display: block;
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--deep-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
            opacity: 0.9;
        }

        .page-title {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            color: var(--deep-green);
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-subtitle {
            text-align: center;
            color: #7A8585;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* ======= INPUT FIELDS ======= */
        .form-field {
            position: relative;
            margin-bottom: 16px;
        }

        .form-field .field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0ACAC;
            font-size: 0.9rem;
            z-index: 3;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-field:focus-within .field-icon {
            color: var(--deep-green);
        }

        .form-field input {
            width: 100%;
            padding: 13px 15px 13px 44px;
            border: 1.5px solid rgba(0, 0, 0, 0.10);
            border-radius: 11px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #111111;
            background: #FAFBFB;
            transition: all 0.3s ease;
            font-family: 'Manrope', sans-serif;
        }

        .form-field input:focus {
            outline: none;
            border-color: var(--deep-green);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(7, 61, 53, 0.08);
        }

        .form-field input::placeholder {
            color: #B0B8B8;
            font-weight: 500;
        }

        .form-field input.is-invalid {
            border-color: #B42318;
        }

        .form-field input.is-invalid:focus {
            box-shadow: 0 0 0 3.5px rgba(180, 35, 24, 0.08);
        }

        /* Password toggle */
        .pass-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #A0ACAC;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            z-index: 3;
        }

        .pass-toggle:hover {
            color: var(--gold);
            transform: translateY(-50%) scale(1.12);
        }

        .login-options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .remember-password-check {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #5d6868;
            cursor: pointer;
        }

        .remember-password-check input {
            accent-color: var(--deep-green);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password-link {
            color: var(--deep-green);
            text-decoration: none;
            font-weight: 900;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
            color: var(--gold);
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #073D35 0%, #0A5446 50%, #315C43 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 0.4px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(7, 61, 53, 0.28);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #7A8585;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .register-link a {
            color: var(--deep-green);
            text-decoration: none;
            font-weight: 900;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: var(--gold);
        }

        @media (max-width: 540px) {
            .login-card {
                padding: 30px 24px 26px;
                border-radius: 16px;
            }

            .page-title {
                font-size: 2.1rem;
            }

            .brand-title {
                font-size: 1.3rem;
            }

            .brand-subtitle {
                letter-spacing: 2.5px;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 24px 18px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">
    <!-- Brand Logo -->
    <div class="brand-logo">
        <div class="brand-logo-mark">
            <span class="brand-logo-frame"></span>
            <span class="brand-logo-inner">MF</span>
        </div>
        <div class="brand-divider"></div>
        <div class="brand-text">
            <span class="brand-title">Mogadishu</span>
            <span class="brand-subtitle">Modern Furniture</span>
        </div>
    </div>

    <h1 class="page-title">Welcome Back</h1>
    <p class="page-subtitle">Login to your account</p>

    <div id="alertContainer"></div>

    <form id="loginForm">
        <!-- Email Field -->
        <div class="form-field">
            <i class="fa-regular fa-envelope field-icon"></i>
            <input 
                type="email" 
                id="loginEmail" 
                class="auth-input" 
                placeholder="Gmail"
                required
            >
        </div>

        <!-- Password Field -->
        <div class="form-field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input 
                type="password" 
                id="loginPassword" 
                class="auth-input" 
                placeholder="Password"
                required
            >
            <i class="fa-solid fa-eye-slash pass-toggle password-toggle-icon" onclick="togglePasswordVisibility('loginPassword')"></i>
        </div>

        <!-- Remember Password & Forgot Password Link -->
        <div class="login-options-row">
            <label class="remember-password-check">
                <input type="checkbox" id="rememberCheck">
                <span>Remember password</span>
            </label>
            <a href="#" class="forgot-password-link" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                Forgot Password?
            </a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <!-- Register Link -->
    <div class="register-link">
        Don't have an account? <a href="register.html">Create one now</a>
    </div>
</div>

<!-- ===== FORGOT PASSWORD MODAL ===== -->
<div class="modal fade auth-modal" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reset Your Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="fp-progress-dots">
                    <div class="fp-dot active"></div>
                    <div class="fp-dot"></div>
                    <div class="fp-dot"></div>
                </div>

                <!-- Step 1: Phone Number -->
                <div id="fpStep1" class="fp-step active">
                    <h6 style="font-weight: 700; margin-bottom: 12px; color: var(--deep-green);">Verify Your Phone Number</h6>
                    <p style="font-size: 0.85rem; color: #666666; margin-bottom: 16px;">
                        Enter the phone number you registered with.
                    </p>
                    <div class="auth-form-group">
                        <label class="auth-label" for="fpPhone">Phone Number</label>
                        <div class="auth-input-wrapper">
                            <i class="fa-solid fa-phone auth-input-icon-left"></i>
                            <input 
                                type="tel" 
                                id="fpPhone" 
                                class="auth-input auth-input-with-icon" 
                                placeholder="Enter your registered phone"
                            >
                        </div>
                    </div>
                    <button type="button" class="auth-button auth-button-primary mt-2" onclick="fpNextFromStep1()">
                        Next
                    </button>
                </div>

                <!-- Step 2: Verification Code -->
                <div id="fpStep2" class="fp-step">
                    <h6 style="font-weight: 700; margin-bottom: 12px; color: var(--deep-green);">Verify Your Code</h6>
                    <div id="fpCodeMessage" class="fp-message"></div>
                    <div class="auth-form-group">
                        <label class="auth-label" for="fpCode">Verification Code</label>
                        <div class="auth-input-wrapper">
                            <i class="fa-solid fa-key auth-input-icon-left"></i>
                            <input 
                                type="text" 
                                id="fpCode" 
                                class="auth-input auth-input-with-icon" 
                                placeholder="Enter 6-digit code"
                            >
                        </div>
                    </div>
                    <div class="fp-button-group">
                        <button type="button" class="auth-button auth-button-secondary" onclick="fpGoBack(2)">
                            Back
                        </button>
                        <button type="button" class="auth-button auth-button-primary" onclick="fpNextFromStep2()">
                            Verify
                        </button>
                    </div>
                </div>

                <!-- Step 3: Reset Password -->
                <div id="fpStep3" class="fp-step">
                    <h6 style="font-weight: 700; margin-bottom: 12px; color: var(--deep-green);">Create New Password</h6>
                    <div class="auth-form-group">
                        <label class="auth-label" for="fpNewPassword">New Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fa-solid fa-lock auth-input-icon-left"></i>
                            <input 
                                type="password" 
                                id="fpNewPassword" 
                                class="auth-input auth-input-with-icon" 
                                placeholder="Min 8 chars, include a number"
                            >
                            <i class="fa-solid fa-eye-slash password-toggle-icon" onclick="togglePasswordVisibility('fpNewPassword')"></i>
                        </div>
                    </div>
                    <div class="auth-form-group">
                        <label class="auth-label" for="fpConfirmPassword">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fa-solid fa-lock auth-input-icon-left"></i>
                            <input 
                                type="password" 
                                id="fpConfirmPassword" 
                                class="auth-input auth-input-with-icon" 
                                placeholder="Repeat your password"
                            >
                            <i class="fa-solid fa-eye-slash password-toggle-icon" onclick="togglePasswordVisibility('fpConfirmPassword')"></i>
                        </div>
                    </div>
                    <div class="fp-button-group">
                        <button type="button" class="auth-button auth-button-secondary" onclick="fpGoBack(3)">
                            Back
                        </button>
                        <button type="button" class="auth-button auth-button-primary" onclick="fpSubmitNewPassword()">
                            Reset Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=17"></script>

<script>
    // Initialize forgot password modal
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    if (forgotPasswordModal) {
        forgotPasswordModal.addEventListener('show.bs.modal', function() {
            initForgotPassword();
        });
    }
</script>

</body>
</html>
